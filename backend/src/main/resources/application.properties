spring.application.name=backend

spring.datasource.url=Your_Url

spring.datasource.username=Your_UserName

spring.datasource.password=Your_DB Password

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Spring Mail SMTP Configuration (used by OTP verification, forgot-password,
# emergency alerts and feedback acknowledgement emails)
# --- Gmail Setup (App Password) ---
# Host: smtp.gmail.com | Port: 587
# Username: your Gmail address
# Password: 16-character Gmail App Password (Google Account -> Security -> 2-Step Verification -> App passwords)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Support/dispatch mailbox that receives emergency SOS alerts and feedback
app.support.email=${APP_SUPPORT_EMAIL}
